<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b4d"/>
      <stop offset="0.65" stop-color="#2a1080"/>
      <stop offset="1" stop-color="#6a11cb"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b0f7a"/>
      <stop offset="1" stop-color="#b616c9"/>
    </linearGradient>
    <radialGradient id="p1" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8ef0ff"/>
      <stop offset="0.6" stop-color="#5aa8f0"/>
      <stop offset="1" stop-color="#e86be8"/>
    </radialGradient>
    <radialGradient id="p2" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d36bff"/>
      <stop offset="1" stop-color="#5a14b8"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="80" cy="40" r="1.5"/><circle cx="210" cy="90" r="1"/><circle cx="330" cy="30" r="1.5"/>
    <circle cx="470" cy="70" r="1"/><circle cx="760" cy="35" r="1.5"/><circle cx="900" cy="85" r="1"/>
    <circle cx="1040" cy="40" r="1.5"/><circle cx="1150" cy="100" r="1"/><circle cx="600" cy="20" r="1"/>
  </g>

  <!-- squiggles -->
  <path d="M140 40 l25 20 l-25 20 l25 20" stroke="#ff4fd8" stroke-width="4" fill="none" filter="url(#glow)"/>
  <path d="M1020 290 q20 -30 40 0 t40 0" stroke="#ff4fd8" stroke-width="4" fill="none" filter="url(#glow)"/>

  <!-- planet left -->
  <circle cx="170" cy="215" r="62" fill="url(#p1)" filter="url(#glow)"/>
  <!-- ringed planet right -->
  <circle cx="1030" cy="110" r="52" fill="url(#p2)" filter="url(#glow)"/>
  <ellipse cx="1030" cy="110" rx="90" ry="18" fill="none" stroke="#ff7bf0" stroke-width="4" transform="rotate(-18 1030 110)" opacity="0.9"/>

  <!-- floor + grid -->
  <rect y="270" width="1200" height="130" fill="url(#floor)"/>
  <g stroke="#ff5be6" stroke-width="1.6" opacity="0.85">
    <line x1="600" y1="270" x2="-600" y2="400"/><line x1="600" y1="270" x2="-300" y2="400"/>
    <line x1="600" y1="270" x2="0" y2="400"/><line x1="600" y1="270" x2="200" y2="400"/>
    <line x1="600" y1="270" x2="400" y2="400"/><line x1="600" y1="270" x2="600" y2="400"/>
    <line x1="600" y1="270" x2="800" y2="400"/><line x1="600" y1="270" x2="1000" y2="400"/>
    <line x1="600" y1="270" x2="1200" y2="400"/><line x1="600" y1="270" x2="1500" y2="400"/>
    <line x1="600" y1="270" x2="1800" y2="400"/>
    <line x1="0" y1="278" x2="1200" y2="278"/><line x1="0" y1="290" x2="1200" y2="290"/>
    <line x1="0" y1="306" x2="1200" y2="306"/><line x1="0" y1="328" x2="1200" y2="328"/>
    <line x1="0" y1="358" x2="1200" y2="358"/><line x1="0" y1="398" x2="1200" y2="398"/>
  </g>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="#7be9ff" stroke-width="2" filter="url(#glow)"/>

  <!-- text -->
  <text x="600" y="150" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="82" fill="#ffffff" filter="url(#glow)">AMAN MAURYA</text>
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#ff9bf0" filter="url(#glow)">AI &amp; Data Engineering Student</text>
  <text x="600" y="248" text-anchor="middle" font-family="Courier New, monospace" font-size="19" letter-spacing="5" fill="#e6d9ff">ARTIFICIAL INTELLIGENCE | MACHINE LEARNING | DATA ENGINEERING</text>
</svg>
